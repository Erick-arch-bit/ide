[workspace]
members = [
  "crates/app",
  "crates/ide-core",
  "crates/ui",
  "crates/editor",
  "crates/workspace",
  "crates/language",
  "crates/terminal",
  "crates/extensions",
]
resolver = "2"

[workspace.dependencies]
anyhow = "1.0.102"
log = "0.4.29"
env_logger = "0.11.10"
eframe = "0.31"
egui = "0.31"
rfd = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
lsp-types = "0.95"
portable-pty = "0.9"
vt100 = "0.16"